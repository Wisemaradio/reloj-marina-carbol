<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marina Stereo 91.7 FM</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: #163653;
}

.pantalla {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 15% 20%,
            rgba(20,125,210,.055), transparent 25%),
        radial-gradient(circle at 90% 80%,
            rgba(0,75,150,.045), transparent 28%),
        #f8fafc;
}

/* FONDO ELEGANTE */

.lineas-fondo {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: .55;
}

.linea {
    position: absolute;
    height: 1px;
    background: linear-gradient(
        90deg, transparent,
        rgba(20,100,170,.13), transparent
    );
    transform: rotate(-18deg);
}

.linea:nth-child(1) {
    width: 75%; top: 15%; left: -10%;
}
.linea:nth-child(2) {
    width: 65%; top: 30%; right: -8%;
    transform: rotate(17deg);
}
.linea:nth-child(3) {
    width: 80%; top: 52%; left: -15%;
}
.linea:nth-child(4) {
    width: 60%; top: 68%; right: -5%;
    transform: rotate(15deg);
}
.linea:nth-child(5) {
    width: 70%; top: 84%; left: -10%;
}
.linea:nth-child(6) {
    width: 45%; top: 43%; right: -5%;
    transform: rotate(-14deg);
}

.circulo {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,91,170,.07);
}
.c1 {
    width: 35vw; height: 35vw;
    top: -20vw; right: -8vw;
}
.c2 {
    width: 28vw; height: 28vw;
    bottom: -18vw; left: -8vw;
}

/* CABECERA */

.superior {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 18vh;
    padding: 3vh 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
}

.logo-superior {
    width: 15vw;
    max-width: 220px;
    min-width: 130px;
    height: auto;
    object-fit: contain;
}

/* FRECUENCIA Y BOTÓN */

.frecuencia-contenedor {
    display: flex;
    align-items: center;
    gap: 1.4vw;
}

.frecuencia {
    display: flex;
    align-items: baseline;
    gap: .7vw;
    color: #123d63;
}

.numero {
    font-size: 5vw;
    font-weight: 750;
    letter-spacing: -2px;
}

.fm {
    font-size: 1.9vw;
    font-weight: 700;
}

#boton-fullscreen {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border: 1px solid rgba(18,61,99,.22);
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    color: #123d63;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 1;
    transition: opacity .3s, transform .2s;
}

#boton-fullscreen:hover {
    transform: scale(1.08);
}

body.controles-ocultos #boton-fullscreen {
    opacity: 0;
    pointer-events: none;
}

/* ESCUDO DE LA ARMADA */

.logo-armada {
    position: absolute;
    top: 1vh;
    left: 50%;
    transform: translateX(-50%);
    width: clamp(650px, 68vw, 1250px);
    height: clamp(120px, 14vh, 160px);
    object-fit: contain;
    object-position: center;
    border-radius: 0;
    z-index: 20;
    pointer-events: none;
}

/* EN VIVO */

.en-vivo {
    position: absolute;
    top: 17vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    color: #b52230;
    font-size: clamp(14px, 1.25vw, 22px);
    font-weight: 800;
    letter-spacing: 2.5px;
    white-space: nowrap;
    z-index: 20;
}

.punto {
    width: 10px;
    height: 10px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #d92532;
    box-shadow: 0 0 8px rgba(217,37,50,.25);
    animation: pulso 1.5s infinite;
}

@keyframes pulso {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.75); }
}

/* CONTENIDO CENTRAL */

.contenido {
    position: absolute;
    top: 18vh;
    left: 0;
    width: 100%;
    height: 66vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
}

/* RELOJ */

.reloj {
    width: 60%;
    text-align: center;
    position: relative;
    z-index: 5;
}

#hora {
    font-size: 10.5vw;
    font-weight: 600;
    letter-spacing: .015em;
    line-height: 1.05;
    color: #173b5c;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(20,70,110,.04);
}

#fecha {
    margin-top: 2.8vh;
    font-size: 2vw;
    font-weight: 500;
    color: #60798d;
    text-transform: capitalize;
}

/* ÁREA VISUAL */

.visual {
    width: 40%;
    height: 82%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.onda {
    position: absolute;
    width: 100%;
    height: 45%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: .10;
    z-index: 1;
}

.onda span {
    width: 6px;
    border-radius: 20px;
    background: #087bd3;
    animation: onda 2.4s ease-in-out infinite;
}

.onda span:nth-child(1)  { height: 20%; animation-delay: -.2s; }
.onda span:nth-child(2)  { height: 35%; animation-delay: -.4s; }
.onda span:nth-child(3)  { height: 50%; animation-delay: -.6s; }
.onda span:nth-child(4)  { height: 70%; animation-delay: -.8s; }
.onda span:nth-child(5)  { height: 88%; animation-delay: -1s; }
.onda span:nth-child(6)  { height: 100%; animation-delay: -1.2s; }
.onda span:nth-child(7)  { height: 88%; animation-delay: -1s; }
.onda span:nth-child(8)  { height: 70%; animation-delay: -.8s; }
.onda span:nth-child(9)  { height: 50%; animation-delay: -.6s; }
.onda span:nth-child(10) { height: 35%; animation-delay: -.4s; }
.onda span:nth-child(11) { height: 20%; animation-delay: -.2s; }

@keyframes onda {
    0%, 100% { transform: scaleY(.75); }
    50% { transform: scaleY(1.08); }
}

/* IMÁGENES ROTATIVAS */

.contenedor-imagen {
    position: relative;
    width: 90%;
    height: 90%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

#imagen-marina {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    transition: opacity 1s ease, transform 1s ease;
}

#imagen-marina.logo-png {
    width: 108%;
    max-width: 108%;
    max-height: 108%;
    border: none;
    border-radius: 0;
    box-shadow: none;
    filter: none;
}

#imagen-marina.logo-pendon {
    max-width: 100%;
    max-height: 100%;
    border-radius: 18px;
    filter: drop-shadow(0 10px 20px rgba(0,50,100,.12));
}

.oculta {
    opacity: 0;
    transform: scale(.96);
}

/* DIVISOR */

.divisor {
    position: absolute;
    left: 50%;
    top: 23vh;
    width: 1px;
    height: 52vh;
    background: linear-gradient(
        to bottom, transparent,
        rgba(20,100,160,.12), transparent
    );
    z-index: 2;
}

/* PIE DE PÁGINA */

.inferior {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 16vh;
    border-top: 1px solid rgba(30,80,120,.13);
    padding: 2vh 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
}

.identidad,
.ubicacion {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

/* MISMO TAMAÑO PARA LOS TRES TEXTOS PRINCIPALES */

.identidad strong,
.ubicacion strong,
.web {
    font-size: 1.7vw;
    font-weight: 800;
    letter-spacing: .5px;
    color: #153e60;
}

.identidad span,
.ubicacion span {
    font-size: 1.1vw;
    font-weight: 500;
    color: #526d82;
}

.ubicacion {
    text-align: center;
}

.web {
    white-space: nowrap;
}

/* LÍNEA INFERIOR */

.linea-azul {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #063b78, #087bd9, #063b78);
    z-index: 30;
}

/* PANTALLAS PEQUEÑAS */

@media (max-width: 900px) {
    .superior {
        height: 16vh;
    }

    .logo-superior {
        width: 24vw;
        min-width: 85px;
    }

    .numero {
        font-size: 8vw;
    }

    .fm {
        font-size: 3vw;
    }

    .logo-armada {
        top: 1vh;
        width: 125px;
        height: 42px;
    }

    .en-vivo {
        top: 7vh;
        font-size: 2.2vw;
        letter-spacing: 1.5px;
    }

    #boton-fullscreen {
        width: 34px;
        height: 34px;
        font-size: 19px;
    }

    .contenido {
        top: 16vh;
        height: 69vh;
        flex-direction: column;
    }

    .reloj {
        width: 100%;
    }

    #hora {
        font-size: 15vw;
        font-weight: 600;
    }

    #fecha {
        font-size: 3.5vw;
    }

    .visual {
        width: 65%;
        height: 35%;
    }

    .divisor {
        display: none;
    }

    .inferior {
        height: 15vh;
    }

    .identidad strong,
    .ubicacion strong,
    .web {
        font-size: 2.8vw;
        letter-spacing: 0;
    }

    .identidad span,
    .ubicacion span {
        font-size: 2vw;
    }
}
</style>
</head>

<body>
<div class="pantalla">

    <div class="lineas-fondo">
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="linea"></div>
        <div class="circulo c1"></div>
        <div class="circulo c2"></div>
    </div>

    <!-- ESCUDO INSTITUCIONAL -->
    <img
        class="logo-armada"
        src="imagenes/logo-armada.png"
        alt="Armada de Colombia"
    >

    <div class="en-vivo">
        <span class="punto"></span>
        EN VIVO
    </div>

    <header class="superior">
        <img
            src="imagenes/LOGO.png"
            alt="Marina Stereo"
            class="logo-superior"
        >

        <div class="frecuencia-contenedor">
            <div class="frecuencia">
                <span class="numero">91.7</span>
                <span class="fm">FM</span>
            </div>

            <button
                id="boton-fullscreen"
                title="Pantalla completa"
                aria-label="Pantalla completa"
                type="button"
            >⛶</button>
        </div>
    </header>

    <div class="divisor"></div>

    <main class="contenido">
        <section class="reloj">
            <div id="hora">00:00:00</div>
            <div id="fecha">Cargando fecha...</div>
        </section>

        <section class="visual">
            <div class="onda">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span>
            </div>

            <div class="contenedor-imagen">
                <img
                    id="imagen-marina"
                    src="imagenes/LOGO.png"
                    alt="Marina Stereo"
                    class="logo-png"
                >
            </div>
        </section>
    </main>

    <footer class="inferior">
        <div class="identidad">
            <strong>MARINA STEREO</strong>
            <span>La Radio de la Gente</span>
        </div>

        <div class="ubicacion">
            <strong>EL CARMEN DE BOLÍVAR</strong>
            <span>Colombia</span>
        </div>

        <div class="web">www.marinastereo.com</div>
    </footer>

    <div class="linea-azul"></div>
</div>

<script>
/* RELOJ COLOMBIA */

function actualizarReloj() {
    const ahora = new Date();

    document.getElementById("hora").textContent =
        new Intl.DateTimeFormat("es-CO", {
            timeZone: "America/Bogota",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(ahora);

    document.getElementById("fecha").textContent =
        new Intl.DateTimeFormat("es-CO", {
            timeZone: "America/Bogota",
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(ahora);
}

actualizarReloj();
setInterval(actualizarReloj, 1000);

/* ROTACIÓN DE LOGOS */

const imagenes = [
    { src: "imagenes/LOGO.png", clase: "logo-png" },
    { src: "imagenes/logo-pendon.jpg", clase: "logo-pendon" }
];

let posicion = 0;
const imagen = document.getElementById("imagen-marina");

function cambiarImagen() {
    imagen.classList.add("oculta");

    setTimeout(() => {
        const siguiente = (posicion + 1) % imagenes.length;
        const elemento = imagenes[siguiente];
        const precarga = new Image();

        precarga.onload = () => {
            posicion = siguiente;
            imagen.src = elemento.src;
            imagen.className = elemento.clase;
        };

        precarga.onerror = () => {
            imagen.classList.remove("oculta");
            console.warn("No se pudo cargar la imagen:", elemento.src);
        };

        precarga.src = elemento.src;
    }, 1000);
}

imagen.addEventListener("load", () => {
    imagen.classList.remove("oculta");
});

setInterval(cambiarImagen, 8000);

/* PANTALLA COMPLETA */

const boton = document.getElementById("boton-fullscreen");
let temporizadorControles;

async function alternarPantallaCompleta() {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        console.warn("Pantalla completa no disponible.", error);
    }
}

boton.addEventListener("click", alternarPantallaCompleta);

function mostrarControles() {
    document.body.classList.remove("controles-ocultos");
    clearTimeout(temporizadorControles);

    if (document.fullscreenElement) {
        temporizadorControles = setTimeout(() => {
            document.body.classList.add("controles-ocultos");
        }, 2500);
    }
}

document.addEventListener("mousemove", mostrarControles);
document.addEventListener("keydown", mostrarControles);

document.addEventListener("fullscreenchange", () => {
    document.body.classList.remove("controles-ocultos");
    clearTimeout(temporizadorControles);

    if (document.fullscreenElement) {
        mostrarControles();
    }
});
</script>
</body>
</html>
